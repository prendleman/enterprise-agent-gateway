apiVersion: v1
kind: ConfigMap
metadata:
  name: agent-gateway-config
  labels:
    app.kubernetes.io/name: enterprise-agent-gateway
data:
  APP_NAME: Enterprise Agent Gateway
  APP_ENV: demo
  DEMO_MODE: "true"
  USE_FAKE_PROVIDERS: "true"
  LOG_JSON: "true"
  LOG_LEVEL: INFO
  READINESS_DB_CHECK: "true"
  DATABASE_URL: sqlite+aiosqlite:///./artifacts/agent_gateway.db
  POLICIES_PATH: /app/config/policies.yaml
  TOOL_PERMISSIONS_PATH: /app/config/tool_permissions.yaml
  MODEL_PRICING_PATH: /app/config/model_pricing.example.yaml
