apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: agent-gateway
  labels:
    app.kubernetes.io/name: enterprise-agent-gateway
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: enterprise-agent-gateway
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: 8000
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 8000
  egress:
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 53
        - protocol: UDP
          port: 53
