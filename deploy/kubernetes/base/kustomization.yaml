apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: agent-gateway

resources:
  - namespace.yaml
  - serviceaccount.yaml
  - configmap.yaml
  - secret.example.yaml
  - deployment.yaml
  - service.yaml
  - hpa.yaml
  - pdb.yaml
  - networkpolicy.yaml

commonLabels:
  app.kubernetes.io/managed-by: kustomize
  app.kubernetes.io/version: "0.1.0"

images:
  - name: enterprise-agent-gateway
    newName: enterprise-agent-gateway
    newTag: local
